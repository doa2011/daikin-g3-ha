{
  "show_message": {
    "fields": {
      "entry_id": {
        "required": true,
        "selector": {
          "config_entry": {
            "integration": "daikin_g3"
          }
        }
      },
      "text": {
        "required": true,
        "selector": {
          "text": {
            "multiline": true
          }
